name: Weekly risk summary

on:
  schedule:
    - cron: "30 3 * * 1"   # every Monday 09:00 IST
  workflow_dispatch:        # "Run workflow" button for live demos

jobs:
  send-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas anthropic google-genai
      - run: python weekly_summary.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          SUMMARY_TO: ${{ secrets.SUMMARY_TO }}
