<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>AttendGuard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.css">
<style>
  html, body { margin: 0; background: #07070D; }
  #boot { position: fixed; inset: 0; display: grid; place-items: center; color: #C7C9D9;
    font: 500 15px Inter, system-ui, sans-serif; background: #07070D; z-index: 0; }
  #boot b { display: block; font: 700 26px 'Space Grotesk', Inter, sans-serif; color: #fff; margin-bottom: 8px; }
  #boot .ring { width: 38px; height: 38px; margin: 0 auto 18px; border-radius: 50%;
    border: 3px solid rgba(124,92,255,.25); border-top-color: #7C5CFF; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #root { position: fixed; inset: 0; z-index: 1; }
</style>
</head>
<body>
<div id="boot"><div style="text-align:center"><div class="ring"></div><b>AttendGuard</b>
  Starting the app in your browser… (first load takes ~20 seconds)</div></div>
<div id="root"></div>
<script type="module">
  import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.9.2/build/stlite.js";
  const files = Object.fromEntries(["app.py", "core/__init__.py", "core/ai.py", "core/config.py", "core/demo_data.py", "core/notify.py", "core/risk.py", "core/summary.py", "core/timetable.py", "assets/style.css", "assets/hero.html", "data/sample/attendance.csv", "data/sample/marks.csv", "data/sample/timetable.csv", "sample_data/students.csv", "sample_data/attendance.csv", "sample_data/test_results.csv", "sample_data/teacher_timetable.csv", "sample_data/templates/attendance.csv", "sample_data/templates/attendance_summary.csv", "sample_data/templates/students.csv", "sample_data/templates/teacher_timetable.csv", "sample_data/templates/test_results.csv"].map(f => [f, { url: "./app/" + f }]));
  mount({ requirements: ["plotly==5.24.1", "openpyxl"], entrypoint: "app.py", files, streamlitConfig: {"theme.base": "dark", "theme.primaryColor": "#7C5CFF", "theme.backgroundColor": "#07070D", "theme.secondaryBackgroundColor": "#12121D", "theme.textColor": "#E6E7EE", "theme.font": "sans serif", "client.toolbarMode": "minimal"} },
        document.getElementById("root"));
  // Remove the boot screen once the app has rendered its sidebar.
  const boot = document.getElementById("boot");
  const timer = setInterval(() => {
    if (document.querySelector('[data-testid="stSidebar"]')) { boot.remove(); clearInterval(timer); }
  }, 300);
</script>
</body>
</html>
